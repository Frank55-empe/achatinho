<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de automações</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--text:#1b1f24;--muted:#667085;--line:#e1e4e8;--accent:#2f5de0;--ok:#1f8a4c;--err:#c8332b;--warn:#b7791f;--idle:#a4acb9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--surface:#1a1f26;--text:#e8ebef;--muted:#98a2b3;--line:#2a313a;--accent:#8aa6ff;--ok:#4ac27d;--err:#ff7b72;--warn:#e3b341;--idle:#5b6573;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:20px;margin:0 0 14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
button,select,input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 11px}
button{cursor:pointer}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px}
.tabs button[aria-current=true]{border-bottom-color:var(--accent);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar label{color:var(--muted);display:flex;gap:6px;align-items:center}
.bar input[type=search]{flex:1 1 220px}
.row{background:var(--surface);border-bottom:1px solid var(--line);border-left:4px solid var(--idle)}
.row.ok{border-left-color:var(--ok)}.row.err{border-left-color:var(--err)}.row.warn{border-left-color:var(--warn)}
summary{display:flex;gap:6px 14px;flex-wrap:wrap;padding:10px 12px;cursor:pointer}
time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:128px}
.detail{color:var(--muted);flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
pre{margin:0;padding:12px;overflow:auto;background:var(--bg);font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.contact{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;padding:10px 12px}
.contact .who{min-width:170px}.contact .who a{color:var(--accent);font-weight:600;text-decoration:none}
.contact small{display:block;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1 1 240px}
.tag{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:1px 4px 1px 10px;font-size:13px}
.tag button{border:0;background:none;padding:0 6px;color:var(--muted);border-radius:99px}
.tags input{width:120px;padding:3px 9px;font-size:13px}
.empty{color:var(--muted);padding:28px 4px}
.login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
.msg{color:var(--err);min-height:1.4em;margin:0}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...kids.flat().filter((x) => x != null));
  return e;
};
const fmt = (d) => new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
let token = sessionStorage.getItem("tok") || "", tab = "logs", timer = null;

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { sessionStorage.removeItem("tok"); token = ""; login("Senha incorreta."); throw new Error("401"); }
  if (!r.ok) throw new Error("Erro " + r.status);
  return r.json();
}

function login(msg = "") {
  clearInterval(timer);
  const pass = h("input", { type: "password", placeholder: "Senha do painel", autocomplete: "current-password", required: "" });
  $("#app").replaceChildren(h("form", { class: "login", onsubmit: (e) => {
    e.preventDefault(); token = pass.value; sessionStorage.setItem("tok", token); boot();
  } }, h("h1", {}, "Painel de automações"), pass, h("button", {}, "Entrar"), h("p", { class: "msg" }, msg)));
  pass.focus();
}

const KINDS = {
  reply_sent: ["DM enviada", "ok"], reply_error: ["Falha ao enviar a DM", "err"], dry_run: ["Teste, não enviou", "warn"],
  no_rule: ["Comentário sem regra", "idle"], no_token: ["Conta sem token", "err"], bad_signature: ["Assinatura inválida", "err"],
  verify_ok: ["Webhook verificado", "ok"], verify_fail: ["Verificação do webhook falhou", "err"],
  "change:comments": ["Comentário recebido", "idle"], messaging: ["Mensagem recebida", "idle"],
  handler_error: ["Erro interno", "err"], rules_error: ["Erro no rules.json", "err"],
};
function detail(e) {
  const p = e.payload || {};
  if (e.type === "reply_sent") return `Para @${p.to || "?"}, regra "${p.rule}"`;
  if (["dry_run", "no_rule"].includes(e.type)) return p.text;
  if (["reply_error", "handler_error", "rules_error"].includes(e.type)) return p.error;
  if (e.type === "change:comments") return `@${p.value?.from?.username || "?"}: ${p.value?.text || ""}`;
  return "";
}

async function boot() {
  const stats = h("div", { class: "stats" });
  const body = h("div");
  const tabs = h("div", { class: "tabs" });
  $("#app").replaceChildren(h("h1", {}, "Automações do Instagram"), stats, tabs, body);

  const show = (t) => {
    tab = t; clearInterval(timer);
    tabs.replaceChildren(...[["logs", "Logs"], ["contacts", "Contatos"]].map(([id, label]) =>
      h("button", { "aria-current": String(tab === id), onclick: () => show(id) }, label)));
    (t === "logs" ? logsView : contactsView)(body);
  };
  const s = await api("/api/stats").catch(() => null);
  if (!s) return;
  stats.replaceChildren(
    ...[["DMs enviadas nas últimas 24 horas", s.sent], ["Erros nas últimas 24 horas", s.errors], ["Contatos", s.contacts]]
      .map(([label, n]) => h("div", { class: "stat" }, h("b", {}, String(n)), h("span", {}, label))));
  show(tab);
}

function logsView(root) {
  const filter = h("select", { "aria-label": "Filtrar eventos", onchange: load },
    ...[["", "Todos os eventos"], ["reply_sent", "DMs enviadas"], ["reply_error,no_token,handler_error,rules_error,bad_signature,verify_fail", "Erros"],
        ["dry_run", "Testes"], ["change:comments", "Comentários recebidos"]].map(([v, l]) => h("option", { value: v }, l)));
  const auto = h("input", { type: "checkbox", onchange: () => { clearInterval(timer); if (auto.checked) timer = setInterval(load, 10000); } });
  const list = h("div");
  root.replaceChildren(h("div", { class: "bar" }, filter, h("label", {}, auto, "Atualizar sozinho"), h("button", { onclick: load }, "Atualizar")), list);
  async function load() {
    const rows = await api("/api/logs?type=" + encodeURIComponent(filter.value));
    list.replaceChildren(...(rows.length ? rows.map((e) => {
      const [label, tone] = KINDS[e.type] || [e.type, "idle"];
      return h("details", { class: "row " + tone },
        h("summary", {}, h("time", {}, fmt(e.at)), h("b", {}, label), h("span", { class: "detail" }, detail(e))),
        h("pre", {}, JSON.stringify(e.payload, null, 2)));
    }) : [h("p", { class: "empty" }, "Nenhum evento ainda. Comente na conta conectada para ver os eventos aqui.")]));
  }
  load();
}

function contactsView(root) {
  const search = h("input", { type: "search", placeholder: "Buscar por @usuário ou tag", "aria-label": "Buscar contatos" });
  const list = h("div");
  root.replaceChildren(h("div", { class: "bar" }, search), list);
  let wait;
  search.addEventListener("input", () => { clearTimeout(wait); wait = setTimeout(load, 300); });
  async function edit(id, change) { await api(`/api/contacts/${id}/tags`, change); load(); }
  async function load() {
    const rows = await api("/api/contacts?q=" + encodeURIComponent(search.value));
    list.replaceChildren(...(rows.length ? rows.map((c) => {
      const add = h("input", { placeholder: "Nova tag", "aria-label": "Adicionar tag", onkeydown: (e) => {
        if (e.key === "Enter" && add.value.trim()) edit(c.id, { add: [add.value] });
      } });
      return h("div", { class: "row contact" },
        h("div", { class: "who" },
          h("a", { href: "https://instagram.com/" + (c.username || ""), target: "_blank", rel: "noopener" }, "@" + (c.username || "sem nome")),
          h("small", {}, `${c.comments} comentário${c.comments === 1 ? "" : "s"}, visto em ${fmt(c.last_seen)}`)),
        h("div", { class: "tags" },
          ...c.tags.map((t) => h("span", { class: "tag" }, t, h("button", { "aria-label": "Remover tag " + t, onclick: () => edit(c.id, { remove: [t] }) }, "×"))), add));
    }) : [h("p", { class: "empty" }, "Nenhum contato ainda. Contatos aparecem quando um comentário ativa uma regra.")]));
  }
  load();
}

token ? boot() : login();
</script>
</body>
</html>
